<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade16_mariana.html</title>
</head>
<body style="background-color: white; color: black; text-align: center; transition: 0.3s;">
    <button onclick="alternarModo()">Alternar Modo</button>

    <script>
        function alternarModo() {
            document.body.style.backgroundColor = 
                document.body.style.backgroundColor === "black" ? "white" : "black";
            document.body.style.color = 
                document.body.style.color === "white" ? "black" : "white";
        }
    </script>
</body>
</html>
