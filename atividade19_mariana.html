<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombra Dinâmica</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 50px;
            transition: text-shadow 0.2s ease-in-out;
        }

        h1:hover {
            text-shadow: 5px 5px 10px rgb(255, 255, 255),
                         -5px -5px 10px rgba(255, 53, 245, 0.89);
        }
    </style>
</head>
<body>
    <h1>essa e a luz no fim do túnel !!! </h1>
</body>
</html>
