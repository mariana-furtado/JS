<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade18_mariana.html</title>
</head>
<body style="background-color: black; color: white; text-align: center; transition: 0.3s;">
    <button onclick="iluminar()">Aumentar Luminosidade</button>

    <script>
        let brilho = 5;
        function iluminar() {
            brilho = Math.min(brilho + 25, 255);
            document.body.style.backgroundColor = `rgb(${brilho}, ${brilho}, ${brilho})`;
            document.body.style.color = brilho > 128 ? "black" :
            "white";
        }
        </script>
        </body>
        </html>
